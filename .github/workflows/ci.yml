name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `node >=18`, no dependencies. Run the check on the floor and on every later line
  # without `npm install`, so both claims are tested rather than stated.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The handler's contract, once per harness environment: a short result prints
      # nothing (the harness proceeds unchanged); a long result comes back as JSON with
      # the replacement on Claude Code and, on Codex, as nothing until codex.replace is on.
      - run: |
          short='{"hook_event_name":"PostToolUse","session_id":"ci","tool_use_id":"t1","tool_name":"Bash","tool_input":{"command":"echo ok"},"tool_response":{"stdout":"ok\n","stderr":"","interrupted":false,"isImage":false},"cwd":"/tmp"}'
          long=$(node -e 'process.stdout.write(JSON.stringify({hook_event_name:"PostToolUse",session_id:"ci",tool_use_id:"t2",tool_name:"Bash",tool_input:{command:"seq 1 5000"},tool_response:{stdout:Array.from({length:5000},(_,i)=>String(i+1)).join("\n"),stderr:"",interrupted:false,isImage:false},cwd:"/tmp"}))')
          for h in CLAUDE_PLUGIN_ROOT PLUGIN_ROOT; do
            out="$(echo "$short" | TRIMHOOK_DATA=$RUNNER_TEMP/th-$h env $h=/plugin node bin/trimhook.mjs post-tool-use)"
            test -z "$out" || { echo "$h: a short result must pass unchanged, got $out"; exit 1; }
          done
          out="$(echo "$long" | TRIMHOOK_DATA=$RUNNER_TEMP/th-claude CLAUDE_PLUGIN_ROOT=/plugin node bin/trimhook.mjs post-tool-use)"
          echo "$out" | node -e 'const o=JSON.parse(require("fs").readFileSync(0,"utf8"));const s=o.hookSpecificOutput.updatedToolOutput.stdout;if(!(s.length<=8000&&/trimhook: [\d,]+ of/.test(s)))process.exit(1)' || { echo "Claude Code: expected a trimmed replacement, got $out"; exit 1; }
          out="$(echo "$long" | TRIMHOOK_DATA=$RUNNER_TEMP/th-codex PLUGIN_ROOT=/plugin node bin/trimhook.mjs post-tool-use)"
          test -z "$out" || { echo "Codex: replacement must be opt-in, got $out"; exit 1; }

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # What `npm publish` would actually ship.
      - run: npm pack --dry-run

  # BACKLOG.md is the single source of truth; ROADMAP.md is generated from it and the
  # issues are synced from it. A stale roadmap fails here; the planner's decisions are
  # asserted against a fixture, because a wrong decision opens duplicates or closes
  # open work on a public repository.
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/backlog.mjs lint
      - run: node scripts/backlog.mjs check
      - run: node scripts/backlog_test.mjs
